{% extends 'base.html' %}{% block content %}<section class="panel narrow"><h1>Add Water Reading</h1><form method="post"><label>Location<input name="location" required></label><label>Date/time<input name="recorded_at" placeholder="2026-09-17 10:30" required></label><label>pH<input name="ph" type="number" step="0.1" min="0" required></label><label>Turbidity<input name="turbidity" type="number" step="0.1" min="0" required></label><label>Dissolved oxygen<input name="dissolved_oxygen" type="number" step="0.1" min="0" required></label><button class="button">Save Reading</button></form><p class="note">Demonstration thresholds only; this does not certify drinking-water safety.</p></section>{% endblock %}
