{% extends 'base.html' %}{% block content %}<section class="panel"><h1>Explainable Alerts</h1><div class="scroll"><table><tr><th>Location</th><th>Date/time</th><th>Status</th><th>Reason</th></tr>{% for r in readings %}<tr><td>{{r.location}}</td><td>{{r.recorded_at}}</td><td><span class="status critical">{{r.status}}</span></td><td>{{r.alerts}}</td></tr>{% else %}<tr><td colspan="4">No flagged readings.</td></tr>{% endfor %}</table></div></section>{% endblock %}
